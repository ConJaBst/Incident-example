<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRT Incident Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a steward's review desk. Incident tabs on top, replay left, ruling right, input telemetry underneath. */
:root{
  --bg:#eceef2; --panel:#ffffff; --ink:#141922; --muted:#5a6473; --line:#d3d8e0;
  --accent:#c9460f; --red:#d42f2f; --blue:#1d66db; --proto:#b98900;
  --thr:#1a8f4c; --brk:#d42f2f; --str:#6447cf;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f27; --ink:#e7eaf0; --muted:#98a2b2; --line:#2b323d;
    --accent:#ff8046; --red:#ff5b5b; --blue:#5b9bff; --proto:#f2c230;
    --thr:#3fd083; --brk:#ff5b5b; --str:#a892ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f27; --ink:#e7eaf0; --muted:#98a2b2; --line:#2b323d;
  --accent:#ff8046; --red:#ff5b5b; --blue:#5b9bff; --proto:#f2c230;
  --thr:#3fd083; --brk:#ff5b5b; --str:#a892ff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.page{max-width:1240px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:52ch;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:132px;padding:8px 12px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;
  font:inherit;cursor:pointer;text-align:left}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tab .t{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1;text-transform:uppercase}
.tab[aria-selected="true"]{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tab:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.stage{overflow:hidden}
#view{position:relative;aspect-ratio:16/9;min-height:240px;background:#9fc0e4}
#view canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud.top{top:10px;justify-content:space-between}
.hud.bot{bottom:10px}
.chip{background:rgba(12,15,20,.82);color:#fff;border-radius:4px;padding:4px 8px;font-family:var(--mono);font-size:12px}
#flag{display:none;align-items:center;gap:6px;font-weight:500}
#flag i{width:16px;height:11px;display:inline-block;border:1px solid #fff}
#caption{background:rgba(12,15,20,.82);color:#fff;border-left:4px solid var(--accent);border-radius:4px;padding:6px 10px;font-size:14px;max-width:62ch}
#caption.hit{border-left-color:#ffd23c}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:74px}
.seg{display:flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:5px 0 0 5px;margin-left:0}
.seg .btn:last-child{border-radius:0 5px 5px 0}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#scrub{flex:1 1 160px;min-width:120px;accent-color:var(--accent)}
.verdict{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.verdict h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0;text-transform:uppercase;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.cls{border-color:var(--accent);color:var(--accent)}
.verdict p{margin:0}
.verdict h3{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.pen{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pen .row{display:flex;gap:8px;align-items:baseline}
.pen .big{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15}
.pen .range{font-size:13px;color:var(--muted)}
.sw{flex:0 0 auto;width:10px;height:10px;border-radius:2px;display:inline-block;transform:translateY(1px)}
.verdict ul,.verdict ol{margin:0;padding-left:20px}
.verdict li{margin:3px 0}
.tele{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .name{font-family:var(--display);font-weight:600;font-size:20px;text-transform:uppercase;line-height:1}
.tag{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.fault{border-color:var(--accent);color:var(--accent)}
.card .spd{margin-left:auto;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.live{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.wheel{width:56px;height:56px;border-radius:50%;border:5px solid var(--ink);position:relative}
.wheel::before{content:"";position:absolute;left:50%;top:-5px;width:6px;height:9px;margin-left:-3px;background:var(--accent)}
.wheel::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:5px;margin-top:-2px;background:var(--ink);border-radius:2px}
.bars{display:grid;grid-template-columns:34px 1fr 54px;gap:5px 8px;align-items:center;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar b{position:absolute;top:0;bottom:0;left:0;width:0}
.bar.thr b{background:var(--thr)} .bar.brk b{background:var(--brk)} .bar.str b{background:var(--str)}
.bar.str::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.bars span:nth-child(3n){text-align:right}
.trace{width:100%;height:150px;display:block}
footer{font-size:13px;color:var(--muted);max-width:90ch}
@media (max-width:860px){ .main{grid-template-columns:1fr} h1{font-size:32px} }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <div class="eyebrow">TRT Esports · Official Sporting Code</div>
      <h1 id="h1">Incident Replays</h1>
    </div>
    <p id="lede"></p>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Incidents"></div>

  <div class="main">
    <section class="panel stage" aria-label="Replay">
      <div id="view">
        <div class="hud top"><span class="chip" id="clock">0.00 s</span><span class="chip" id="flag"><i></i><span></span></span></div>
        <div class="hud bot"><div id="caption"></div></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="play" type="button">Pause</button>
        <button class="btn" id="restart" type="button">Restart</button>
        <input type="range" id="scrub" min="0" max="8" step="0.01" value="0" aria-label="Replay position">
        <div class="seg" role="group" aria-label="Playback speed">
          <button class="btn" type="button" data-rate="0.25" aria-pressed="false">¼×</button>
          <button class="btn" type="button" data-rate="0.5" aria-pressed="false">½×</button>
          <button class="btn" type="button" data-rate="1" aria-pressed="true">1×</button>
        </div>
        <button class="btn" id="cam" type="button">Overhead view</button>
      </div>
    </section>
    <aside class="panel verdict" id="verdict" aria-live="polite"></aside>
  </div>

  <section class="tele" id="tele" aria-label="Driver inputs"></section>

  <footer id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="core">
/* Pure simulation core: track geometry, car paths, derived driver inputs. No DOM. */
const SIM=(()=>{
const DT=1/60, CL=x=>Math.max(0,Math.min(1,x));
function lin(k,t){ if(t<=k[0][0])return k[0][1];
  for(let i=1;i<k.length;i++) if(t<=k[i][0]){const a=k[i-1],b=k[i];return a[1]+(b[1]-a[1])*(t-a[0])/((b[0]-a[0])||1);}
  return k[k.length-1][1]; }
function ease(k,t){ if(t<=k[0][0])return k[0][1];
  for(let i=1;i<k.length;i++) if(t<=k[i][0]){const a=k[i-1],b=k[i];let f=(t-a[0])/((b[0]-a[0])||1);f=f*f*(3-2*f);return a[1]+(b[1]-a[1])*f;}
  return k[k.length-1][1]; }
function track(segs){ let x=0,y=0,th=0; const X=[0],Y=[0],TH=[0];
  for(const g of segs){
    if(g.len){ for(let i=0;i<g.len;i++){x+=Math.cos(th);y+=Math.sin(th);X.push(x);Y.push(y);TH.push(th);} }
    else { const L=Math.round(Math.abs(g.deg)*Math.PI/180*g.r), d=(g.deg*Math.PI/180)/L;
      for(let i=0;i<L;i++){th+=d/2;x+=Math.cos(th);y+=Math.sin(th);th+=d/2;X.push(x);Y.push(y);TH.push(th);} } }
  return {x:X,y:Y,th:TH,len:X.length-1}; }
function at(T,s,d){ s=Math.max(0,Math.min(T.len-1e-6,s)); const i=Math.floor(s),f=s-i;
  const x=T.x[i]+(T.x[i+1]-T.x[i])*f, y=T.y[i]+(T.y[i+1]-T.y[i])*f, th=T.th[i]+(T.th[i+1]-T.th[i])*f;
  return [x-d*Math.sin(th), y+d*Math.cos(th), th]; }
function pchip(p){ const n=p.length,h=[],dl=[],m=new Array(n).fill(0);
  for(let i=0;i<n-1;i++){h[i]=p[i+1][0]-p[i][0];dl[i]=(p[i+1][1]-p[i][1])/h[i];}
  for(let i=1;i<n-1;i++) if(dl[i-1]*dl[i]>0){const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/dl[i-1]+w2/dl[i]);}
  return s=>{ if(s<=p[0][0])return p[0][1]; if(s>=p[n-1][0])return p[n-1][1]; let i=0; while(s>p[i+1][0])i++;
    const t=(s-p[i][0])/h[i],t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*p[i][1]+(t3-2*t2+t)*h[i]*m[i]+(-2*t3+3*t2)*p[i+1][1]+(t3-t2)*h[i]*m[i+1]; }; }
function path(T,pts){ const f=pchip(pts), s0=pts[0][0], s1=pts[pts.length-1][0], X=[],Y=[],D=[],S=[],DD=[];
  for(let s=s0;s<=s1+1e-9;s+=0.5){ const d=f(s),p=at(T,s,d); if(X.length) D.push(D[D.length-1]+Math.hypot(p[0]-X[X.length-1],p[1]-Y[Y.length-1])); else D.push(0);
    X.push(p[0]);Y.push(p[1]);S.push(s);DD.push(d); }
  const n=X.length, L=D[n-1];
  function pos(q){ let i;
    if(q<=0) i=0; else if(q>=L) i=n-2; else { let lo=0,hi=n-1; while(hi-lo>1){const m=(lo+hi)>>1; if(D[m]<=q)lo=m; else hi=m;} i=lo; }
    const f=(q-D[i])/((D[i+1]-D[i])||1);
    return [X[i]+(X[i+1]-X[i])*f, Y[i]+(Y[i+1]-Y[i])*f, S[i]+(S[i+1]-S[i])*f, DD[i]+(DD[i+1]-DD[i])*f]; }
  return {pos,len:L}; }
function smooth(a,r){ const o=new Array(a.length); for(let i=0;i<a.length;i++){let s=0,c=0;for(let j=Math.max(0,i-r);j<=Math.min(a.length-1,i+r);j++){s+=a[j];c++;}o[i]=s/c;} return o; }
function run(T,c,dur){ const P=path(T,c.path), n=Math.round(dur/DT)+1;
  const o={x:[],y:[],yaw:[],v:[],thr:[],brk:[],str:[],s:[],d:[],n};
  const hd=q=>{const a=P.pos(q-1.3),b=P.pos(q+1.3);return Math.atan2(b[1]-a[1],b[0]-a[0]);};
  let dist=0;
  for(let i=0;i<n;i++){ const t=i*DT, v=lin(c.speed,t), a=(lin(c.speed,t+DT)-v)/DT, p=P.pos(dist), h=hd(dist);
    let k=hd(dist+0.6)-hd(dist-0.6); k=Math.atan2(Math.sin(k),Math.cos(k))/1.2;
    let thr=(v<0.2&&a<0.2)?0:(a>=-0.3?CL((c.base||0.25)+a/4):0), brk=a<-0.5?CL((-a-0.5)/10):0, str=v>1?Math.max(-1,Math.min(1,k*25)):0;
    for(const ov of c.ovr||[]) if(t>=ov.t0&&t<ov.t1){ if(ov.thr!=null)thr=ov.thr; if(ov.brk!=null)brk=ov.brk; if(ov.str!=null)str=ov.str; }
    o.x.push(p[0]);o.y.push(p[1]);o.s.push(p[2]);o.d.push(p[3]);o.v.push(v);
    o.yaw.push(h+(c.spin?ease(c.spin,t)*Math.PI/180:0)); o.thr.push(thr);o.brk.push(brk);o.str.push(str);
    dist+=v*DT; }
  o.thr=smooth(o.thr,4);o.brk=smooth(o.brk,4);o.str=smooth(o.str,10);
  return o; }
/* Oriented-box overlap depth between two cars at sample i (negative = apart). */
function overlap(A,B,i,da,db){ const ax=[A.yaw[i],A.yaw[i]+Math.PI/2,B.yaw[i],B.yaw[i]+Math.PI/2]; let best=1e9;
  const dx=B.x[i]-A.x[i], dy=B.y[i]-A.y[i];
  for(const a of ax){ const ux=Math.cos(a),uy=Math.sin(a);
    const ra=Math.abs(Math.cos(a-A.yaw[i]))*da[0]/2+Math.abs(Math.sin(a-A.yaw[i]))*da[1]/2;
    const rb=Math.abs(Math.cos(a-B.yaw[i]))*db[0]/2+Math.abs(Math.sin(a-B.yaw[i]))*db[1]/2;
    best=Math.min(best,ra+rb-Math.abs(dx*ux+dy*uy)); }
  return best; }

  for(const E of teleEls){ const o=E.c.o,th=o.thr[i0],br=o.brk[i0],st=o.str[i0];
    E.spd.textContent=Math.round(o.v[i0]*3.6)+' km/h'; E.bt.style.width=(th*100)+'%'; E.bb.style.width=(br*100)+'%';
    const p=Math.abs(st)*50; E.bs.style.left=(st>0?50-p:50)+'%'; E.bs.style.width=p+'%';
    E.vt.textContent=Math.round(th*100)+'%'; E.vb.textContent=Math.round(br*100)+'%';
    const sp=Math.round(Math.abs(st)*100); E.vs.textContent=sp<2?'0':(st>0?'L ':'R ')+sp+'%';
    E.wheel.style.transform=`rotate(${(-st*120).toFixed(1)}deg)`; drawTrace(E,fi); }
  let e=curEv[0]; for(const x of curEv) if(x[0]<=t+1e-6) e=x;
  const cap=$('#caption'); if(cap.textContent!==e[1]) cap.textContent=e[1]; cap.classList.toggle('hit',!!e[2]);
  $('#clock').textContent=t.toFixed(2)+' s'; $('#scrub').value=t;
  const fl=$('#flag'); if(S.flag&&t>=S.flag[0]&&t<=S.flag[1]){ fl.style.display='inline-flex'; fl.firstChild.style.background=S.flag[2]; fl.lastChild.textContent=S.flag[3]; } else fl.style.display='none'; }

function setPlay(p){ playing=p; $('#play').textContent=p?'Pause':(t>=cur.dur?'Replay':'Play'); }
function load(k){ cur=SCN[k]; curA=A?A[cur.id]:null; t=0; hold=0;
  curEv=curA?curA.ev:[[0,cur.setup]].concat(cur.hits.map(h=>[h[0],h[2],1]));
  [...$('#tabs').children].forEach((b,j)=>{b.setAttribute('aria-selected',j===k);b.tabIndex=j===k?0:-1;});
  $('#scrub').max=cur.dur; buildScene(cur); buildVerdict(cur,k); buildTele(cur); cssAge=99;
  if(reduce) t=Math.max(0,cur.hits[0][0]-0.4);
  setPlay(!reduce); frame(); }

SCN.forEach((S,k)=>{ const b=document.createElement('button'); b.className='tab'; b.type='button'; b.setAttribute('role','tab'); const a=A&&A[S.id];
  b.innerHTML=a?`<span class="n">${String(k+1).padStart(2,'0')} · ${esc(a.cls.split(' · ')[0])}</span><span class="t">${esc(a.tab)}</span>`
    :`<span class="n">${S.cars.length} cars</span><span class="t">Incident ${k+1}</span>`;
  b.addEventListener('click',()=>load(k)); $('#tabs').appendChild(b); });
$('#tabs').addEventListener('keydown',e=>{ const k=SCN.indexOf(cur); if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ const n=(k+(e.key==='ArrowRight'?1:SCN.length-1))%SCN.length; load(n); $('#tabs').children[n].focus(); } });
$('#play').addEventListener('click',()=>{ if(!playing&&t>=cur.dur){t=0;hold=0;} setPlay(!playing); });
$('#restart').addEventListener('click',()=>{ t=0; hold=0; setPlay(true); });
$('#scrub').addEventListener('input',e=>{ t=+e.target.value; hold=0; setPlay(false); frame(); });
document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>{ rate=+b.dataset.rate; document.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',x===b)); }));
$('#cam').addEventListener('click',()=>{ overhead=!overhead; $('#cam').textContent=overhead?'Trackside view':'Overhead view'; if(!playing)frame(); });

let last=performance.now();
function tick(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){ if(t<cur.dur){ t=Math.min(cur.dur,t+dt*rate); } else { hold+=dt; if(hold>2){t=0;hold=0;} } frame(); }
  requestAnimationFrame(tick); }
load(0); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
